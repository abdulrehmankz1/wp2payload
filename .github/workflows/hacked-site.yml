name: Hacked site

# Doc 12.14: migrates the hacked-site fixture (a real WordPress seeded with the threats in doc
# 12.3) and runs the sanitizer fuzzing. Called by CI on every change and by Release before
# publishing, so a release cannot ship if this suite fails.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  hacked-site:
    name: Hacked-site suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixture:hacked
      - run: pnpm test:security
        env:
          WP2P_REQUIRE_HACKED: '1'
      - name: Stop the fixture
        if: always()
        run: docker compose -f tests/fixtures/hacked-site/docker-compose.yml down -v
