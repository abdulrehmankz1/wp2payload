name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke

  # Section 2.11 "Install": the packed tarball installs and runs in a clean folder
  # without lifecycle scripts, the way users will get it.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install into a clean Payload project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir site && cd site
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund payload@3 "$RUNNER_TEMP"/wp2payload-*.tgz
          npx wp2payload --version
          npx wp2payload doctor
      - name: Doctor fails outside a Payload project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir empty && cd empty
          npm init -y > /dev/null
          if node ../site/node_modules/wp2payload/dist/cli.js doctor; then
            echo "doctor should exit non-zero without Payload" && exit 1
          fi
