# Doc 12.13: dependency updates grouped weekly. The cooldown leaves new releases a week to be
# pulled or flagged before a PR proposes them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # Types follow the oldest supported Node (engines >=22.12), not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Payload 3 requires graphql 16.
      - dependency-name: graphql
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
