# wp2payload hacked-site fixture (doc 12.14): a throwaway WordPress seeded with the threats in
# doc 12.3. Every sample is inert (alert() calls, a PHP file that only echoes a word).
# Start and seed: node scripts/fixture-hacked-seed.mjs   Reset: docker compose -f tests/fixtures/hacked-site/docker-compose.yml down -v
# All credentials below are obviously fake and only reachable on 127.0.0.1.
name: wp2payload-hacked

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wp2p_hacked
  WORDPRESS_DB_PASSWORD: fixture-only-not-a-secret
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', 'local');

services:
  db:
    image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp2p_hacked
      MYSQL_PASSWORD: fixture-only-not-a-secret
      MYSQL_ROOT_PASSWORD: fixture-root-not-a-secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pfixture-root-not-a-secret --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache@sha256:8901759bfbb7ebc567dbc44a244c0d96d720d0a67c17bc4f42ec355ddba2e863
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:80"
    environment:
      <<: *wp-env
    volumes:
      - wp_data:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro

  # Seeding only: `docker compose run --rm wpcli wp ...` (not started by `up`).
  wpcli:
    image: wordpress:cli-php8.3@sha256:661db880e953da051abcac6c0a769767b995a82cd52101c003ca7438dd427d7d
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./seed.php:/seed/seed.php:ro
      - ../hacked-media:/seed/media:ro

volumes:
  db_data:
  wp_data:
